# The bench tool is a workspace of its own, apart from the repository tasks
# in `xtask/`, with its own `Cargo.lock`.
[workspace]
members = ["kyto-bench-core", "kyto-bench"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

# Every external dependency is an exact version from crates.io. A member
# names it with `workspace = true` and adds no features of its own.
[workspace.dependencies]
# Line patterns are matched against the bytes of one console line with
# Unicode mode off, so the Unicode tables are left out; console lines are
# short, so the literal and DFA optimisations of `perf` are left out; `std` is
# required.
regex = { version = "=1.13.1", default-features = false, features = ["std"] }
# Documents are read into types that derive `Deserialize`, so only the derive
# macros and the allocation support for strings, vectors and maps are needed.
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
# The bench hardware revision is the SHA-256 of the canonical JSON of the
# devices table of an instance configuration, written to a string in memory.
# The tool inserts the keys of each object in sorted order, and
# `preserve_order` keeps objects in the order their keys were inserted; it
# brings the allocation support that writing to strings needs, so the
# standard-library support of the default feature is left out.
serde_json = { version = "=1.0.154", default-features = false, features = ["preserve_order"] }
# SHA-256 is computed over bytes held in memory, so the allocation and
# object-identifier support of the default features is left out.
sha2 = { version = "=0.11.1", default-features = false }
# Board descriptions, identity records and instance configurations are TOML,
# parsed from strings into types that derive `Deserialize` and into tables,
# which needs the parser and the serde support; none is written, so the
# writer and the standard-library support of the default features are left
# out.
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
