id = "eeprom-update"
title = "rpi-eeprom: rpi-eeprom-update"
url = "https://github.com/raspberrypi/rpi-eeprom/blob/3831e51dba65f4493f3f88c1d049de73165c082e/rpi-eeprom-update"
version = "3831e51dba65f4493f3f88c1d049de73165c082e"

