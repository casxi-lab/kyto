# The required checks on the exact candidate commit: the head of a pull
# request to main, or the commit pushed to main. The commits step checks the
# commits after CHECK_BASE: the base of the pull request, or the commit before
# the push. Actions are pinned to full commit SHAs; the comment names the
# release.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: cargo xtask check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Run cargo xtask check
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: cargo xtask check --receipt artifacts/check-receipt.json

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-receipt-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: artifacts/check-receipt.json
          if-no-files-found: error
