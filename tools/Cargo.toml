# The bench tool is a workspace of its own, apart from the repository tasks
# in `xtask/`, with its own `Cargo.lock`.
[workspace]
members = ["kyto-bench-core", "kyto-bench"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

# Every external dependency is an exact version from crates.io. A member
# names it with `workspace = true` and adds no features of its own.
[workspace.dependencies]
# Raw console bytes and sent bytes are kept in receipts in the standard
# alphabet with padding, encoded to and decoded from strings in memory, which
# needs `alloc`; the standard-library support and the unsafe SIMD engines of
# the default features are left out.
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
# The command line of `kyto-bench`, built with the builder of `std`, so the
# derive macros are left out, with its help, usage and error-context texts.
# Its texts are plain and do not depend on the terminal, so colour, wrapping
# to the terminal width and the suggestions of similar names are left out.
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
# The 128-bit nonce of each receipt is read from the operating system's
# generator with `fill`, which needs no feature.
getrandom = { version = "=0.4.3", default-features = false }
# Line patterns are matched against the bytes of one console line with
# Unicode mode off, so the Unicode tables are left out; console lines are
# short, so the literal and DFA optimisations of `perf` are left out; `std` is
# required.
regex = { version = "=1.13.1", default-features = false, features = ["std"] }
# Documents are read into types that derive `Deserialize`, and receipts and
# their public versions are written from types that derive `Serialize`, so
# only the derive macros and the allocation support for strings, vectors and
# maps are needed.
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
# Receipts and their public versions are JSON, rendered in the order of
# their fields and read back from strings in memory; events, and the receipt
# that a public version holds, pass through `serde_json::Value`, whose
# objects keep the order in which their keys were inserted only with
# `preserve_order`, so without it their keys would be sorted and the format
# would change. The bench hardware revision is the SHA-256 of the canonical
# JSON of the devices table of an instance configuration, whose keys the tool
# inserts in sorted order. `preserve_order` brings the allocation support that
# writing to strings needs, so the standard-library support of the default
# feature is left out.
serde_json = { version = "=1.0.154", default-features = false, features = ["preserve_order"] }
# SHA-256 is computed over bytes held in memory, so the allocation and
# object-identifier support of the default features is left out.
sha2 = { version = "=0.11.1", default-features = false }
# Board descriptions, identity records, instance configurations and run
# plans are TOML, parsed from strings into types that derive `Deserialize` and
# into tables, which needs the parser and the serde support; none is written,
# so the writer and the standard-library support of the default features are
# left out.
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
