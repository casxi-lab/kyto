id = "release-notes"
title = "rpi-eeprom: Raspberry Pi 5 bootloader EEPROM release notes"
url = "https://github.com/raspberrypi/rpi-eeprom/blob/3831e51dba65f4493f3f88c1d049de73165c082e/firmware-2712/release-notes.md"
version = "3831e51dba65f4493f3f88c1d049de73165c082e"

