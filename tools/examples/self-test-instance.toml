# An example instance configuration of a bench whose devices are all
# simulated, for trying the bench self-test plan in tools/self-test/ without
# a bench. Its values are documentation values, and its salt is published,
# so no bench may use it.
#
# The pinned set `self-test` lists config.txt and kernel_2712.img of
# tools/self-test/ and, in place of the official device tree files that a
# bench pins, the stand-ins of payload/echo/, from which no board boots. The
# simulated console replays captures/self-test.bin, an example console
# output of the self-test payload written for this example, at both
# power-ons, and answers nothing that it is sent.
format = "kyto-bench instance"
format_version = 1
board = "raspberry-pi-5"

[tftp]
server_address = "192.0.2.10"
path_prefix = ""

[confirmation]
quantity = "supply_voltage"
on_at_least_micro = 4750000
off_at_most_micro = 500000
consecutive = 1
poll_ms = 100
on_timeout_ms = 3000
off_timeout_ms = 3000

[console]
ready_timeout_ms = 2000

[identity]
format = "kyto-bench board identity"
format_version = 1
board = "raspberry-pi-5"
revision_code = { value = "d04171", read = "firmware_log" }
pcb_version = { value = "4", read = "visual" }
soc_stepping = { value = "D0", read = "firmware_log_presence" }
memory.vendor = { value = "unknown", read = "visual" }
memory.part = { value = "unknown", read = "visual" }
ethernet_phy = { value = "unknown", read = "visual" }
spi_flash.jedec_id = { value = "ef4015", read = "firmware_log" }
spi_flash.part = { value = "unknown", read = "visual" }
eeprom_version = { value = "2026/09/25", read = "firmware_version" }
manufacturing_version = { value = "unknown", read = "firmware_log" }
min_boot_version = { value = "unknown", read = "software" }
boot_files = { value = ["bcm2712-rpi-5-b.dtb", "overlays/bcm2712d0.dtbo"], read = "tftp_reads" }

[[pins]]
name = "self-test"
files = [
  { name = "config.txt", sha256 = "221e6f20771e01705b21758eddce44d06c5ec6252db3dbb7e55e609a7a15ec39" },
  { name = "kernel_2712.img", sha256 = "ad5c2ffab80d0d531acace80f606eca2330a67410b549b8556313c83959b1030" },
  { name = "bcm2712-rpi-5-b.dtb", sha256 = "ac44865282f3ffe541775e0fcbfa2f36375e0f97f953f3e37a039583c01d0b0e" },
  { name = "overlays/bcm2712d0.dtbo", sha256 = "f7fbb4699eb8d708e3f0b98c8e5a2c57679dd6a44ea355c8af0c6804706d9902" },
]

[devices]
power = { kind = "simulated", model = "simulated" }
power_confirmation = { kind = "simulated", model = "simulated" }
console = { kind = "simulated", model = "simulated" }
delivery = { kind = "simulated", model = "simulated" }

[[devices.connections]]
from = "console"
to = "board debug UART"

[local]
salt = "d5bedecc5ee387d76097a2fa96272358"

# Paths relative to this file: one cold boot of each entry of the self-test
# plan.
[local.console]
replay = ["captures/self-test.bin", "captures/self-test.bin"]
