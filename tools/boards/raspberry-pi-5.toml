# The Raspberry Pi 5 as the bench tool sees it during a network boot: the
# lines its boot firmware writes to the debug UART, the order of a cold boot,
# how each identity field of a board is read, the device tree files of each
# stepping, the earliest bootloader release a board needs, the payload files
# that let the firmware write the EEPROM, the settings a payload must not
# contain, and the lines that hold values a public receipt must not show.
#
# The address of the TFTP server and the path prefix of the files the board
# reads are parameters of the instance configuration, not of this
# description. The example lines hold no value of a real board: the serial
# number fedc9876 is made up, the MAC addresses 00:00:5e:00:53:a1 (the board)
# and :a2 (the TFTP server) and the IPv4 addresses of 192.0.2.0/24 are
# reserved for documentation, and bench/ stands for the path prefix.
#
# Line patterns are matched against one line without its line ending. A line
# can appear more than once in one cold boot: the BOOTMODE, EEPROM ID and
# MFG_VER lines appear once for each stage of the bootloader. Every match of a
# line that gives an identity value or a firmware version must give the same
# value.
format = "kyto-bench board description"
format_version = 1
id = "raspberry-pi-5"
name = "Raspberry Pi 5"

# Official documents, each at a fixed commit or release.
[[sources]]
id = "revision-codes"
title = "Raspberry Pi documentation: Raspberry Pi revision codes"
url = "https://github.com/raspberrypi/documentation/blob/21d772e7ee022e36a8f43c3ee75e20ca359fb832/documentation/asciidoc/computers/raspberry-pi/revision-codes.adoc"
version = "21d772e7ee022e36a8f43c3ee75e20ca359fb832"

[[sources]]
id = "bootloader"
title = "Raspberry Pi documentation: bootloader configuration"
url = "https://github.com/raspberrypi/documentation/blob/21d772e7ee022e36a8f43c3ee75e20ca359fb832/documentation/asciidoc/computers/raspberry-pi/eeprom-bootloader.adoc"
version = "21d772e7ee022e36a8f43c3ee75e20ca359fb832"

[[sources]]
id = "boot-eeprom"
title = "Raspberry Pi documentation: Raspberry Pi boot EEPROM"
url = "https://github.com/raspberrypi/documentation/blob/21d772e7ee022e36a8f43c3ee75e20ca359fb832/documentation/asciidoc/computers/raspberry-pi/boot-eeprom.adoc"
version = "21d772e7ee022e36a8f43c3ee75e20ca359fb832"

[[sources]]
id = "config-boot"
title = "Raspberry Pi documentation: config.txt boot options"
url = "https://github.com/raspberrypi/documentation/blob/21d772e7ee022e36a8f43c3ee75e20ca359fb832/documentation/asciidoc/computers/config_txt/boot.adoc"
version = "21d772e7ee022e36a8f43c3ee75e20ca359fb832"

[[sources]]
id = "boot-usb"
title = "Raspberry Pi documentation: USB boot modes"
url = "https://github.com/raspberrypi/documentation/blob/21d772e7ee022e36a8f43c3ee75e20ca359fb832/documentation/asciidoc/computers/raspberry-pi/boot-usb.adoc"
version = "21d772e7ee022e36a8f43c3ee75e20ca359fb832"

