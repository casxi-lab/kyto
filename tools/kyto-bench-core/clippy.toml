# Clippy settings for `kyto-bench-core`. Clippy reads only the nearest
# `clippy.toml`, so this file repeats the lists of the workspace file, which a
# test of the workspace checks, and adds the entry points of files, links,
# the network, environment variables, process and system state, threads,
# standard input and output and the clock: the crate has no input or output,
# so everything it decides can be decided again from recorded data.
# `src/lib.rs` also denies the print and `dbg!` macros.

disallowed-methods = [
    # The workspace list: nothing sleeps or reads the system clock.
    { path = "std::thread::sleep", reason = "waits use the bench clock" },
    { path = "std::thread::park_timeout", reason = "waits use the bench clock" },
    { path = "std::time::Instant::now", reason = "time comes from the bench clock" },
    { path = "std::time::Instant::elapsed", reason = "time comes from the bench clock" },
    { path = "std::time::SystemTime::now", reason = "time comes from the bench clock" },
    { path = "std::time::SystemTime::elapsed", reason = "time comes from the bench clock" },
    { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "waits use the bench clock" },
    { path = "std::sync::Condvar::wait_timeout", reason = "waits use the bench clock" },
    { path = "std::sync::Condvar::wait_timeout_while", reason = "waits use the bench clock" },
    # This crate only: no files or directories.
    { path = "std::fs::read", reason = "the core reads no file" },
    { path = "std::fs::read_to_string", reason = "the core reads no file" },
    { path = "std::fs::read_dir", reason = "the core reads no directory" },
    { path = "std::fs::read_link", reason = "the core reads no link" },
    { path = "std::fs::metadata", reason = "the core reads no file" },
    { path = "std::fs::symlink_metadata", reason = "the core reads no file" },
    { path = "std::fs::exists", reason = "the core reads no file" },
    { path = "std::fs::canonicalize", reason = "the core reads no file" },
    { path = "std::fs::write", reason = "the core writes no file" },
    { path = "std::fs::copy", reason = "the core writes no file" },
    { path = "std::fs::hard_link", reason = "the core writes no file" },
    { path = "std::fs::set_permissions", reason = "the core writes no file" },
    { path = "std::fs::create_dir", reason = "the core creates no directory" },
    { path = "std::fs::create_dir_all", reason = "the core creates no directory" },
    { path = "std::fs::remove_file", reason = "the core removes no file" },
    { path = "std::fs::remove_dir", reason = "the core removes no directory" },
    { path = "std::fs::remove_dir_all", reason = "the core removes no directory" },
    { path = "std::fs::rename", reason = "the core renames no file" },
    { path = "std::fs::soft_link", reason = "the core creates no link" },
    { path = "std::fs::set_times", reason = "the core writes no file" },
    { path = "std::fs::set_times_nofollow", reason = "the core writes no file" },
    { path = "std::os::unix::fs::symlink", reason = "the core creates no link", allow-invalid = true },
    { path = "std::os::unix::fs::chown", reason = "the core changes no owner", allow-invalid = true },
    { path = "std::os::unix::fs::lchown", reason = "the core changes no owner", allow-invalid = true },
    { path = "std::os::unix::fs::chroot", reason = "the core changes no directory", allow-invalid = true },
    { path = "std::path::Path::exists", reason = "the core reads no file" },
    { path = "std::path::Path::try_exists", reason = "the core reads no file" },
    { path = "std::path::Path::is_file", reason = "the core reads no file" },
    { path = "std::path::Path::is_dir", reason = "the core reads no directory" },
    { path = "std::path::Path::is_symlink", reason = "the core reads no link" },
    { path = "std::path::Path::metadata", reason = "the core reads no file" },
    { path = "std::path::Path::symlink_metadata", reason = "the core reads no file" },
    { path = "std::path::Path::read_dir", reason = "the core reads no directory" },
    { path = "std::path::Path::read_link", reason = "the core reads no link" },
    { path = "std::path::Path::canonicalize", reason = "the core reads no file" },
    # No environment, command line or process state.
    { path = "std::env::var", reason = "the core reads no environment variable" },
    { path = "std::env::var_os", reason = "the core reads no environment variable" },
    { path = "std::env::vars", reason = "the core reads no environment variable" },
    { path = "std::env::vars_os", reason = "the core reads no environment variable" },
    { path = "std::env::set_var", reason = "the core changes no environment variable" },
    { path = "std::env::remove_var", reason = "the core changes no environment variable" },
    { path = "std::env::args", reason = "the core reads no command line" },
    { path = "std::env::args_os", reason = "the core reads no command line" },
    { path = "std::env::current_dir", reason = "the core reads no directory" },
    { path = "std::env::set_current_dir", reason = "the core changes no directory" },
    { path = "std::env::temp_dir", reason = "the core reads no directory" },
    { path = "std::env::home_dir", reason = "the core reads no directory" },
    { path = "std::env::current_exe", reason = "the core reads no file" },
    { path = "std::process::id", reason = "the core reads no process state" },
    { path = "std::process::exit", reason = "the core ends no process" },
    { path = "std::thread::available_parallelism", reason = "the core reads no system state" },
    # No threads, standard input or output, or name resolution.
    { path = "std::thread::spawn", reason = "the core starts no thread" },
    { path = "std::thread::scope", reason = "the core starts no thread" },
    { path = "std::io::stdin", reason = "the core reads no input" },
    { path = "std::io::stdout", reason = "the core writes no output" },
    { path = "std::io::stderr", reason = "the core writes no output" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "the core uses no network" },
]

disallowed-types = [
    # The workspace list: no external program.
    { path = "std::process::Command", reason = "the tool runs no external program" },
    # This crate only: no files, network, threads or clock.
    { path = "std::fs::File", reason = "the core opens no file" },
    { path = "std::fs::OpenOptions", reason = "the core opens no file" },
    { path = "std::fs::DirBuilder", reason = "the core creates no directory" },
    { path = "std::net::TcpStream", reason = "the core uses no network" },
    { path = "std::net::TcpListener", reason = "the core uses no network" },
    { path = "std::net::UdpSocket", reason = "the core uses no network" },
    { path = "std::os::unix::net::UnixStream", reason = "the core uses no socket", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "the core uses no socket", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", reason = "the core uses no socket", allow-invalid = true },
    { path = "std::thread::Builder", reason = "the core starts no thread" },
    { path = "std::time::Instant", reason = "the core reads no clock" },
    { path = "std::time::SystemTime", reason = "the core reads no clock" },
]
